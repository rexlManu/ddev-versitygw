#ddev-generated
services:
  web:
    environment:
      FILESYSTEM_DISK: ${VERSITYGW_FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${VERSITYGW_ACCESS_KEY:-versity}
      AWS_SECRET_ACCESS_KEY: ${VERSITYGW_SECRET_KEY:-versitysecret}
      AWS_DEFAULT_REGION: ${VERSITYGW_REGION:-us-east-1}
      AWS_BUCKET: ${VERSITYGW_DEFAULT_BUCKET:-local}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # Use the routed endpoint so temporary URLs also work in the browser.
      AWS_ENDPOINT: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17070
      # Laravel derives public URLs from the endpoint and encodes object keys.
      AWS_URL: "null"
      VERSITYGW_RETAIN_VISIBILITY: "false"
      VERSITYGW_LARAVEL_AUTO_SETUP: ${VERSITYGW_LARAVEL_AUTO_SETUP:-true}

  versitygw:
    container_name: ddev-${DDEV_SITENAME}-versitygw
    image: ${VERSITYGW_DOCKER_IMAGE:-ghcr.io/versity/versitygw:v1.9.0}-${DDEV_SITENAME}-built
    build:
      context: versitygw
      args:
        BASE_IMAGE: ${VERSITYGW_DOCKER_IMAGE:-ghcr.io/versity/versitygw:v1.9.0}
    hostname: versitygw
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    entrypoint: ["/bin/sh", "/mnt/ddev_config/versitygw/scripts/start.sh"]
    expose:
      - "7070"
      - "7071"
      - "8080"
    environment:
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: "17070:7070,17071:7071,17080:8080"
      HTTPS_EXPOSE: "17070:7070,17071:7071,17080:8080"
      ROOT_ACCESS_KEY: ${VERSITYGW_ACCESS_KEY:-versity}
      ROOT_SECRET_KEY: ${VERSITYGW_SECRET_KEY:-versitysecret}
      VGW_REGION: ${VERSITYGW_REGION:-us-east-1}
      VGW_CORS_ALLOW_ORIGIN: "*"
      VERSITYGW_DEFAULT_BUCKET: ${VERSITYGW_DEFAULT_BUCKET:-local}
      VERSITYGW_PUBLIC_READ: ${VERSITYGW_PUBLIC_READ:-true}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_PORT: ":7070"
      VGW_ADMIN_PORT: ":7071"
      VGW_WEBUI_PORT: ":8080"
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
      VGW_HEALTH: /health
      VGW_WEBUI_GATEWAYS: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17070
      VGW_WEBUI_ADMIN_GATEWAYS: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17071
    volumes:
      - ".:/mnt/ddev_config"
      - versitygw-s3:/data/s3
      - versitygw-versioning:/data/versioning
      - versitygw-iam:/data/iam
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/versitygw-ready && curl -fsS http://127.0.0.1:7070/health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    x-ddev:
      describe-url-port: |
        WebUI: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17080
      describe-info: |
        S3 API: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17070
        Admin API: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17071
        Laravel endpoint: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:17070
        Access key: ${VERSITYGW_ACCESS_KEY:-versity}
        Secret key: ${VERSITYGW_SECRET_KEY:-versitysecret}
        Region: ${VERSITYGW_REGION:-us-east-1}
        Default bucket: ${VERSITYGW_DEFAULT_BUCKET:-local}
        Public read: ${VERSITYGW_PUBLIC_READ:-true}

volumes:
  versitygw-s3:
  versitygw-versioning:
  versitygw-iam:
