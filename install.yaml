name: versitygw

project_files:
  - config.versitygw.yaml
  - docker-compose.versitygw.yaml
  - commands/host/versitygw
  - commands/versitygw/versitygw-aws
  - versitygw/

ddev_version_constraint: '>= v1.25.2'

post_install_actions:
  - |
    #ddev-description:Show VersityGW setup details
    cat <<EOF

    Installed ddev-versitygw. Run ddev restart to finish setup.

    Laravel uses the local S3 disk automatically. On the first restart,
    the add-on installs the S3 Composer adapter if it is missing and configures
    copies and moves in config/filesystems.php.
    DDEV supplies the local settings without changing your app's .env file.

    Open the web UI: ddev versitygw
    List buckets:   ddev versitygw-aws s3 ls

    Access key: ${VERSITYGW_ACCESS_KEY:-versity}
    Secret key: ${VERSITYGW_SECRET_KEY:-versitysecret}
    Bucket:     ${VERSITYGW_DEFAULT_BUCKET:-local}

    Optional settings: .ddev/.env.versitygw
    See the README for custom credentials, private buckets, and setup options.

    EOF
