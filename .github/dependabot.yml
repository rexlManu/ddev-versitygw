version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/versitygw"
    groups:
      versitygw:
        patterns:
          - "*versitygw*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
